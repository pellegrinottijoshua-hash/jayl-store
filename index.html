         scelta vede un lampo nero a ogni caricamento. Stessa chiave che
         persiste src/store/themeStore.js; mai sull'admin. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('jayl-mode') || '{}').state || {};
        if (s.siteTheme === 'cream' && location.pathname.indexOf('/admin') !== 0) {
          document.documentElement.setAttribute('data-site-theme', 'cream');
        }
      } catch (e) {}
    </script>

    <!-- Google Analytics 4 — Consent Mode (analytics denied by default, granted on cookie accept) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SZQ80GDTJ0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // Consent defaults — denied until user accepts cookie banner
      gtag('consent', 'default', {
        analytics_storage:   'denied',
        ad_storage:          'denied',
        ad_user_data:        'denied',
        ad_personalization:  'denied',
        wait_for_update:     500
      });
      gtag('js', new Date());
      // send_page_view: false — fired manually on route changes from App.jsx
      gtag('config', 'G-SZQ80GDTJ0', { send_page_view: false });
    </script>

    <!-- Umami — analitica SENZA cookie (niente consenso: niente cookie, niente
         localStorage, niente IP salvati). Conta tutti, anche chi rifiuta il
         banner. Pageview, cambi di pagina della SPA e UTM sono automatici; gli
         eventi custom partono da src/lib/analytics.js (trackUmami). -->
    <script>
      /* Website ID — Umami Cloud → Settings → Websites → Edit → Website ID.
         Finché resta null lo script NON si carica e trackUmami() è un no-op. */
      window.__jaylUmamiId = null;
      /* Filtro prima di ogni invio:
         - /admin non si conta, e il browser che lo apre smette di essere
           contato (umami.disabled). Idem aprendo il sito con ?notrack.
         - dell'URL restano solo i parametri utm_*: via fbclid, session id e
           client secret di Stripe, qualunque altro identificativo.
         - l'id ordine nella pagina di conferma diventa un percorso generico.
         - del referrer esterno restano dominio e percorso, non la query. */
      window.__jaylUmamiBeforeSend = function (type, payload) {
        try {
          if (location.pathname.indexOf('/admin') === 0 || /[?&]notrack\b/.test(location.search)) {
            localStorage.setItem('umami.disabled', '1');
            return false;
          }
        } catch (e) {}
        try {
          var u = new URL(payload.url, location.origin), keep = new URLSearchParams();
          u.searchParams.forEach(function (v, k) { if (/^utm_/.test(k)) keep.append(k, v); });
          u.search = keep.toString();
          u.hash = '';
          u.pathname = u.pathname.replace(/^\/order-confirmation\/.*/, '/order-confirmation');
          payload.url = u.toString();
        } catch (e) {}
        try {
          if (payload.referrer && /^https?:/.test(payload.referrer)) {
            var r = new URL(payload.referrer);
            payload.referrer = r.origin + r.pathname;
          }
        } catch (e) {}
        return payload;
      };
      if (window.__jaylUmamiId) {
        var s = document.createElement('script');
        s.async = true;
        s.id = 'jayl-umami';
        s.src = 'https://cloud.umami.is/script.js';
        s.setAttribute('data-website-id', window.__jaylUmamiId);
        s.setAttribute('data-domains', 'jayl.store,www.jayl.store');
        s.setAttribute('data-before-send', '__jaylUmamiBeforeSend');
        s.setAttribute('data-performance', 'true');
        document.head.appendChild(s);
      }
    </script>

    <!-- Marketing pixels (Meta Pixel + Pinterest Tag + TikTok Pixel) — GDPR/ePrivacy:
         nothing is loaded or fired until the user accepts marketing cookies in
         the banner. __jaylLoadMarketing() is called by CookieBanner on accept,
         and auto-runs on repeat visits where consent was already granted. -->
    <script>
      /* TikTok Pixel ID — TikTok Business Center → Strumenti → Eventi → Pixel web.
         Finché resta null il pixel NON si carica: nessuno script scaricato,
         nessuna richiesta di rete, nessun errore in console. Gli eventi
         ttq.track() sparsi nell'app sono già al loro posto e diventano attivi
         da soli nel momento in cui qui c'è un id. */
      window.__jaylTiktokPixelId = null;

      window.__jaylLoadMarketing = function () {
        if (window.__jaylMarketingLoaded) return;
        window.__jaylMarketingLoaded = true;
        /* Meta Pixel */
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '2044599416436249');
        fbq('track', 'PageView');
        /* Pinterest Tag */
        !function(e){if(!window.pintrk){window.pintrk=function(){window.pintrk.queue.push(Array.prototype.slice.call(arguments))};var n=window.pintrk;n.queue=[],n.version="3.0";var t=document.createElement("script");t.async=!0,t.src=e;var r=document.getElementsByTagName("script")[0];r.parentNode.insertBefore(t,r)}}("https://s.pinimg.com/ct/core.js");
        pintrk('load', '2613163991136');
        pintrk('page');
        /* TikTok Pixel — solo se un id è stato configurato sopra. */
        if (window.__jaylTiktokPixelId) {
          !function (w, d, t) {
            w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var i="https://analytics.tiktok.com/i18n/pixel/events.js";ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=i,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};var o=d.createElement("script");o.type="text/javascript",o.async=!0,o.src=i+"?sdkid="+e+"&lib="+t;var a=d.getElementsByTagName("script")[0];a.parentNode.insertBefore(o,a)};
          }(window, document, 'ttq');
          ttq.load(window.__jaylTiktokPixelId);
          ttq.page();
        }
      };
      try { if (localStorage.getItem('jayl_cookie_consent') === 'accepted') window.__jaylLoadMarketing(); } catch (e) {}
    </script>
