    <!-- Pinterest domain verification — replace content value with token from Pinterest Business → Claim Website -->

    <!-- Google Analytics 4 — Consent Mode (analytics denied by default, granted on cookie accept) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SZQ80GDTJ0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // Consent defaults — denied until user accepts cookie banner
      gtag('consent', 'default', {
        analytics_storage:   'denied',
        ad_storage:          'denied',
        ad_user_data:        'denied',
        ad_personalization:  'denied',
        wait_for_update:     500
      });
      gtag('js', new Date());
      // send_page_view: false — fired manually on route changes from App.jsx
      gtag('config', 'G-SZQ80GDTJ0', { send_page_view: false });
    </script>

    <!-- Marketing pixels (Meta Pixel + Pinterest Tag) — GDPR/ePrivacy:
         nothing is loaded or fired until the user accepts marketing cookies in
         the banner. __jaylLoadMarketing() is called by CookieBanner on accept,
         and auto-runs on repeat visits where consent was already granted. -->
    <script>
      window.__jaylLoadMarketing = function () {
        if (window.__jaylMarketingLoaded) return;
        window.__jaylMarketingLoaded = true;
        /* Meta Pixel */
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '2044599416436249');
        fbq('track', 'PageView');
        /* Pinterest Tag */
        !function(e){if(!window.pintrk){window.pintrk=function(){window.pintrk.queue.push(Array.prototype.slice.call(arguments))};var n=window.pintrk;n.queue=[],n.version="3.0";var t=document.createElement("script");t.async=!0,t.src=e;var r=document.getElementsByTagName("script")[0];r.parentNode.insertBefore(t,r)}}("https://s.pinimg.com/ct/core.js");
        pintrk('load', '2613163991136');
        pintrk('page');
      };
      try { if (localStorage.getItem('jayl_cookie_consent') === 'accepted') window.__jaylLoadMarketing(); } catch (e) {}
    </script>
